<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3e5145">
  <meta name="robots" content="noindex,nofollow">
  <title>Pipeline</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/board-theme.css">
  <link rel="stylesheet" href="/table.css">
  <link rel="stylesheet" href="/workspace.css">
  <link rel="stylesheet" href="/sunset.css">
  <link rel="stylesheet" href="/harbor.css">
  <link rel="stylesheet" href="/vintage.css">
  <script src="/socket.io/socket.io.js" defer></script>
  <script src="/geometry.js" defer></script>
  <script src="/sounds.js" defer></script>
  <script src="/workspace.js" defer></script>
  <script src="/table.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/presence.js" defer></script>
</head>
<body>
  <main>
    <section id="lobby" class="lobby">
      <div class="intro"><h1>Pipeline.</h1></div>
      <div class="lobby-panel">
        <nav class="mode-switch" aria-label="Table mode"><button type="button" class="selected" data-mode="create">Create a table</button><button type="button" data-mode="join">Join a table</button><button type="button" data-mode="local">Same device</button></nav>
        <form id="room-form">
          <label for="name">Your name</label><input id="name" autocomplete="nickname" maxlength="24" required placeholder="How should we call you?">
          <div id="code-field" hidden><label for="code">Table code</label><input id="code" maxlength="8" autocapitalize="characters" spellcheck="false" placeholder="8-character code"></div>
          <div id="partner-field" hidden><label for="partner">Partner’s name</label><input id="partner" maxlength="24" placeholder="Player two"></div>
          <button id="submit-room" class="primary wide" type="submit" disabled>Create a private table <span>↗</span></button>
        </form>
        <details class="restore"><summary>Restore from a recovery file</summary><label for="restore-file">Private seat recovery file</label><input type="file" id="restore-file" accept=".json,application/json"></details>
        <div id="saved" hidden><hr><label for="saved-select">Your saved tables</label><div class="saved-row"><select id="saved-select"></select><button id="resume" class="secondary">Rejoin</button></div></div>
      </div>
    </section>
    <section id="opening-roll" class="opening-roll" tabindex="-1" aria-labelledby="roll-heading" hidden>
      <div class="roll-card">
        <h1 id="roll-heading">Who goes first?</h1>
        <div class="roll-players">
          <div class="roll-player"><div class="starter-avatar" data-starter-avatar="0" aria-hidden="true"></div><span data-roll-name="0"></span><span class="starter-badge" aria-hidden="true">First turn</span></div>
          <div class="roll-player"><div class="starter-avatar" data-starter-avatar="1" aria-hidden="true"></div><span data-roll-name="1"></span><span class="starter-badge" aria-hidden="true">First turn</span></div>
        </div>
        <p id="roll-result" role="status" aria-live="polite">Choosing the first player…</p>
      </div>
    </section>
    <section id="table" hidden>
      <div class="table-heading setup-header">
        <div class="round-strip"><span>YEAR 1 <small>8 rounds</small></span><span>YEAR 2 <small>6 rounds</small></span><span>YEAR 3 <small>4 rounds</small></span></div>
        <div class="invite"><span id="table-identity">TABLE <b id="table-code"></b></span><button class="secondary" id="copy">Copy invite</button><button class="secondary" id="download-save" hidden>Save recovery file</button><button class="text-button" id="leave">Back to lobby</button></div>
      </div>
      <div id="waiting" class="waiting" hidden>One seat is open. Send the invite link to your partner to bring them to the table.</div>
      <div id="players" class="players"></div>
      <button id="start-game" class="primary" disabled>Start the game</button>
      <div id="game-board" hidden></div>
      <div class="table-bottom"><details class="activity" open><summary>Table activity</summary><ol id="log"></ol></details></div>
    </section>
  </main>
  <div id="notice" role="status" aria-live="polite" hidden></div>
</body>
</html>
